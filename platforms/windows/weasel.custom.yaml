# Weasel UI style for PuffIME
#
# Five color schemes (Weasel uses 0xBBGGRR, i.e. BGR, not RGB):
#   puff                 Puff 淺
#   puff_dark            Puff 深
#   puff_gray            Puff 灰
#   puff_macaron         Puff 馬卡龍
#   puff_mediterranean   Puff 地中海
#
# Switch with:  powershell -ExecutionPolicy Bypass -File tools\theme.ps1 -Name dark
# or edit style/color_scheme below.
#
# Common UI: Microsoft JhengHei, single-row candidates, rounded corners,
# visible border.
patch:
  style:
    color_scheme: puff
    font_face: "Microsoft JhengHei"
    font_point: 14
    label_font_face: "Microsoft JhengHei"
    label_font_point: 12
    comment_font_face: "Microsoft JhengHei"
    comment_font_point: 10
    horizontal: true
    inline_preedit: true
    hover_type: none
    layout:
      max_width: 0          # 0 = single row (no wrapping)
      min_width: 0
      margin_x: 12
      margin_y: 10
      spacing: 10
      candidate_spacing: 8
      hilite_spacing: 4
      hilite_padding: 3
      border_width: 2
      corner_radius: 8
      round_corner: 8
      shadow_radius: 4
      shadow_offset_x: 0
      shadow_offset_y: 3
      linespacing: 0
      baseline: 0

  preset_color_schemes:
    # ── 淺 / Light ─────────────────────────────────────────────
    puff:
      name: "Puff 淺"
      author: PuffIME
      back_color: 0xFAFAFA
      border_color: 0xD0D0D0
      shadow_color: 0x22000000
      text_color: 0x222222
      hilited_text_color: 0x111111
      hilited_back_color: 0xFEF0E8          # RGB E8F0FE (light blue)
      candidate_text_color: 0x333333
      comment_text_color: 0x888888
      label_color: 0x888888
      hilited_label_color: 0x666666
      hilited_candidate_text_color: 0xA1470D  # RGB 0D47A1 (deep blue)
      hilited_candidate_back_color: 0xFDF2E3  # RGB E3F2FD (pale blue)
      hilited_comment_text_color: 0x666666

    # ── 深 / Dark ──────────────────────────────────────────────
    puff_dark:
      name: "Puff 深"
      author: PuffIME
      back_color: 0x28231E                  # RGB 1E2328 (deep blue-gray)
      border_color: 0x52463A                # RGB 3A4652
      shadow_color: 0x66000000
      text_color: 0xE6E6E6
      hilited_text_color: 0xFFFFFF
      hilited_back_color: 0x4D3B2D          # RGB 2D3B4D
      candidate_text_color: 0xD6D6D6
      comment_text_color: 0xAEA49A          # RGB 9AA4AE
      label_color: 0x9E948A                 # RGB 8A949E
      hilited_label_color: 0xD0C8C0         # RGB C0C8D0
      hilited_candidate_text_color: 0xFFD19B  # RGB 9BD1FF
      hilited_candidate_back_color: 0x5E4934  # RGB 34495E
      hilited_comment_text_color: 0xCCC2B8  # RGB B8C2CC

    # ── 灰 / Gray ──────────────────────────────────────────────
    puff_gray:
      name: "Puff 灰"
      author: PuffIME
      back_color: 0xE8E8E8
      border_color: 0xB0B0B0
      shadow_color: 0x33000000
      text_color: 0x333333
      hilited_text_color: 0x111111
      hilited_back_color: 0xD6D6D6
      candidate_text_color: 0x444444
      comment_text_color: 0x767676
      label_color: 0x767676
      hilited_label_color: 0x555555
      hilited_candidate_text_color: 0x111111
      hilited_candidate_back_color: 0xCACACA
      hilited_comment_text_color: 0x555555

    # ── 馬卡龍 / Macaron ──────────────────────────────────────
    puff_macaron:
      name: "Puff 馬卡龍"
      author: PuffIME
      back_color: 0xF8F2FD                  # RGB FDF2F8 (pale pink)
      border_color: 0xC8B7E7                # RGB E7B7C8 (pink)
      shadow_color: 0x22000000
      text_color: 0x3A2C4A                  # RGB 4A2C3A (plum)
      hilited_text_color: 0x241A2E          # RGB 2E1A24
      hilited_back_color: 0xE8F5DF          # RGB DFF5E8 (mint)
      candidate_text_color: 0x4A3A5A        # RGB 5A3A4A
      comment_text_color: 0x907CA8          # RGB A87C90 (mauve)
      label_color: 0x907CA8
      hilited_label_color: 0x66527A         # RGB 7A5266
      hilited_candidate_text_color: 0x442A5B  # RGB 5B2A44
      hilited_candidate_back_color: 0xF7DDE6  # RGB E6DDF7 (lavender)
      hilited_comment_text_color: 0x66527A

    # ── 地中海 / Mediterranean ────────────────────────────────
    puff_mediterranean:
      name: "Puff 地中海"
      author: PuffIME
      back_color: 0xE8F3F7                  # RGB F7F3E8 (warm sand)
      border_color: 0xC9B88F                # RGB 8FB8C9 (sea blue)
      shadow_color: 0x22000000
      text_color: 0x4D3A1F                  # RGB 1F3A4D (deep navy)
      hilited_text_color: 0x473212          # RGB 123247
      hilited_back_color: 0xF2F0D9          # RGB D9F0F2 (light turquoise)
      candidate_text_color: 0x5A4A2B        # RGB 2B4A5A
      comment_text_color: 0x968A6B          # RGB 6B8A96
      label_color: 0x968A6B
      hilited_label_color: 0x786B4A         # RGB 4A6B78
      hilited_candidate_text_color: 0x2A4B8A  # RGB 8A4B2A (terracotta)
      hilited_candidate_back_color: 0xC8E3F5  # RGB F5E3C8 (light sand)
      hilited_comment_text_color: 0x786B4A
